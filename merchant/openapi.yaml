openapi: 3.0.3
info:
  title: 'Softlemon Merchant API'
  description: "Production-ready merchant integration endpoints for admin-provisioned API keys.\n\n## 3D Secure Integration Flow\n\nSoftLemon uses a server-managed 3DS flow. You do **not** need to handle CAVV, ECI, or DS Transaction IDs yourself.\n\n### Step 1 — Initiate 3DS Verification\n\n`POST /api/v1/3ds/verify` with card details, amount, currency, and `auth_url` (your frontend return URL).\n\n### Step 2 — Handle the response\n\n- **Frictionless:** The response returns immediately with `status: full_auth`. Use the returned `id` in Step 3.\n- **Challenge:** The response includes a `challenge_url`. Redirect the cardholder to this URL to complete the bank challenge.\n\n### Step 3 — Cardholder completes challenge (if applicable)\n\nAfter the cardholder completes the challenge, they are redirected to your `auth_url` with query parameters:\n\n`?card_verification_id={id}&status=full_auth` (or `status=failed`)\n\n### Step 4 — Initiate the transaction\n\n`POST /api/v1/transactions` with `card_verification_data.id` set to the verification ID from Step 1 or the redirect.\n\n```json\n\"card_verification_data\": { \"id\": 43 }\n```\n\nThe API automatically retrieves the stored 3DS authentication data (CAVV, ECI, etc.) and passes it to the payment gateway."
  version: 0.9.0
servers:
  -
    url: 'https://api.sandbox.softlemons.com'
tags:
  -
    name: Transactions
    description: ''
  -
    name: 'Card Verification'
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Use the API key provisioned by your SoftLemon admin team. Self-service onboarding and API key generation are not currently available.'
security:
  -
    default: []
paths:
  /api/v1/transactions:
    post:
      summary: 'Initiate Transaction'
      operationId: initiateTransaction
      description: "Initiate a new transaction.\n\nUse `transaction_type: sale` for an immediate, complete charge — the funds are captured automatically and no further action is needed. Use `transaction_type: auth` to place a hold on the cardholder's funds; you must then call the **Capture** endpoint to settle the payment.\n\nMerchant API keys can call this endpoint for their own account.\nPartner API keys can also call this endpoint, but they must include `merchant_id`\nfor a merchant linked to that partner.\nCapture, refund, and void operations remain merchant-only.\n\nIf 3DS verification was performed via `POST /api/v1/3ds/verify`, pass `card_verification_data.id` to link the stored 3DS authentication data. You do not need to resend CAVV, ECI, or other 3DS fields — they are retrieved automatically from the verification record."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Transaction initiated'
                  code: ''
                  data:
                    id: 2
                    related_trans_id: null
                    merchant_id: 1
                    cardholder_id: 2
                    amount: 1250
                    currency: EUR
                    status: auth
                    transaction_type: auth
                    merchant_trans_id: ORDER-912346
                    acquirer_trans_id: '514009741995'
                    acquirer_auth_code: '400066'
                    acquirer_ref_num: '741995'
                    ip_address: 172.19.0.7
                    updated_at: '2025-05-20T09:18:48.000000Z'
                    created_at: '2025-05-20T09:18:47.000000Z'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Transaction initiated'
                  code:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      related_trans_id:
                        type: string
                        example: null
                      merchant_id:
                        type: integer
                        example: 1
                      cardholder_id:
                        type: integer
                        example: 2
                      amount:
                        type: integer
                        example: 1250
                      currency:
                        type: string
                        example: EUR
                      status:
                        type: string
                        example: auth
                      transaction_type:
                        type: string
                        example: auth
                      merchant_trans_id:
                        type: string
                        example: ORDER-912346
                      acquirer_trans_id:
                        type: string
                        example: '514009741995'
                      acquirer_auth_code:
                        type: string
                        example: '400066'
                      acquirer_ref_num:
                        type: string
                        example: '741995'
                      ip_address:
                        type: string
                        example: 172.19.0.7
                      updated_at:
                        type: string
                        example: '2025-05-20T09:18:48.000000Z'
                      created_at:
                        type: string
                        example: '2025-05-20T09:18:47.000000Z'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Authentication failed'
                  code: ERR_AUTH_FAILED
                  data: null
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Authentication failed'
                  code:
                    type: string
                    example: ERR_AUTH_FAILED
                  data:
                    type: string
                    example: null
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Validation errors'
                  code: ERR_VALIDATION_FAILED
                  data: null
                  errors:
                    amount:
                      - 'The transaction amount must be a number.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Validation errors'
                  code:
                    type: string
                    example: ERR_VALIDATION_FAILED
                  data:
                    type: string
                    example: null
                  errors:
                    type: object
                    properties:
                      amount:
                        type: array
                        example:
                          - 'The transaction amount must be a number.'
                        items:
                          type: string
      tags:
        - Transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  description: 'Transaction amount.'
                  example: 12.5
                currency:
                  type: string
                  description: 'Transaction currency.'
                  example: GBP
                transaction_type:
                  type: string
                  description: "The type of transaction you want to initiate. Use **`sale`** for an immediate, complete charge — no separate capture step required. Use **`auth`** to reserve (hold) the funds on the cardholder's card; you must then call the capture endpoint to settle the payment."
                  example: sale
                  enum:
                    - sale
                    - auth
                vault_token:
                  type: string
                  description: 'Vault token from a previous transaction. When provided, card number, expiry month and expiry year are not required — only CVV is still needed.'
                  example: vtok_a1b2c3d4e5f6
                  nullable: true
                card:
                  type: object
                  description: 'Card details object.'
                  example: []
                  properties:
                    number:
                      type: string
                      description: 'Card number.'
                      example: '4111111111111111'
                    exp_month:
                      type: string
                      description: 'Card expire month.'
                      example: '12'
                    exp_year:
                      type: string
                      description: 'Card expiry year (4 digits).'
                      example: '2030'
                    cvv:
                      type: string
                      description: 'Card CVV number (3-4 digits).'
                      example: '123'
                    name:
                      type: string
                      description: 'Cardholder name.'
                      example: 'John Doe'
                      nullable: true
                  required:
                    - number
                    - exp_month
                    - exp_year
                    - cvv
                reference:
                  type: string
                  description: 'Merchant reference for this transaction.'
                  example: order-10001
                  nullable: true
                merchant_id:
                  type: integer
                  description: 'Required for partner API keys. Omit for merchant API keys.'
                  example: 123
                  nullable: true
                success_url:
                  type: string
                  description: 'URL to redirect to on successful payment (reserved for future use).'
                  example: 'https://yoursite.com/checkout/success'
                  nullable: true
                error_url:
                  type: string
                  description: 'URL to redirect to on failed payment (reserved for future use).'
                  example: 'https://yoursite.com/checkout/error'
                  nullable: true
                customer:
                  type: object
                  description: 'Customer details object.'
                  example: []
                  properties:
                    merchant_customer_id:
                      type: string
                      description: "Merchant's ID of the customer."
                      example: cust-001
                    first_name:
                      type: string
                      description: "Customer's first name."
                      example: John
                    last_name:
                      type: string
                      description: "Customer's last name."
                      example: Doe
                    email:
                      type: string
                      description: "Customer's email address."
                      example: john.doe@example.com
                    phone:
                      type: string
                      description: "Customer's phone number."
                      example: '+441234567890'
                      nullable: true
                    address:
                      type: string
                      description: "Customer's address."
                      example: '1 High Street'
                      nullable: true
                    city:
                      type: string
                      description: "Customer's city."
                      example: London
                      nullable: true
                    postal_code:
                      type: string
                      description: "Customer's postal code."
                      example: SW1A 1AA
                      nullable: true
                    country_code:
                      type: string
                      description: "Customer's country code."
                      example: GB
                      nullable: true
                    ip_address:
                      type: string
                      description: "Customer's IP address."
                      example: 198.51.100.5
                      nullable: true
                  required:
                    - merchant_customer_id
                    - first_name
                    - last_name
                    - email
                  nullable: true
                card_verification_data:
                  type: object
                  description: 'Links a completed 3DS verification to this transaction. Pass the `id` returned from `POST /api/v1/3ds/verify` (or the `card_verification_id` query parameter from the redirect). The API retrieves stored CAVV, ECI, and DS Transaction ID automatically — you do not need to send them.'
                  example:
                    id: 43
                  properties:
                    id:
                      type: integer
                      description: 'ID of the 3DS verification record returned by `POST /api/v1/3ds/verify`.'
                      example: 43
                  required:
                    - id
                  nullable: true
              required:
                - amount
                - currency
                - transaction_type
                - card
