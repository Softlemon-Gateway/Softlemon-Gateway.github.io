<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Softlemon Integration API</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        main {
            padding: 24px;
            text-align: center;
        }

        a {
            color: inherit;
            font-weight: 600;
        }
    </style>
</head>
<body>
<main>
    <p>Redirecting to the API documentation. Choose <a href="./merchant.html">Merchant</a> or <a href="./partner.html">Partner</a>.</p>
</main>
<script>
    (function () {
        var storedView = 'merchant';

        try {
            storedView = window.localStorage.getItem('softlemon-api-docs-view') || 'merchant';
        } catch (error) {
        }

        if (storedView !== 'partner') {
            storedView = 'merchant';
        }

        var url = new URL(window.location.href);
        var requestedView = url.searchParams.get('view');
        var view = requestedView === 'partner' || requestedView === 'merchant' ? requestedView : storedView;

        window.location.replace('./' + view + '.html');
    }());
</script>
</body>
</html>
