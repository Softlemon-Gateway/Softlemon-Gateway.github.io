paths:
  /api/register/merchant:
    post:
      summary: 'Register Merchant'
      operationId: registerMerchant
      description: 'Register a new merchant user.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Merchant registered successfully. Please complete verification.'
                  code: ''
                  data:
                    user_id: 13
                    merchant_id: 17
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Merchant registered successfully. Please complete verification.'
                  code:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                        example: 13
                      merchant_id:
                        type: integer
                        example: 17
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Validation error'
                  code: ERR_VALIDATION_FAILED
                  data: null
                  errors:
                    name:
                      - 'The name field is required.'
                    email:
                      - 'The email has already been taken.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Validation error'
                  code:
                    type: string
                    example: ERR_VALIDATION_FAILED
                  data:
                    type: string
                    example: null
                  errors:
                    type: object
                    properties:
                      name:
                        type: array
                        example:
                          - 'The name field is required.'
                        items:
                          type: string
                      email:
                        type: array
                        example:
                          - 'The email has already been taken.'
                        items:
                          type: string
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Merchant username.'
                  example: architecto
                  nullable: false
                email:
                  type: string
                  description: 'Merchant email. Must be a valid email.'
                  example: merchant@example.com
                  nullable: false
                password:
                  type: string
                  description: 'Merchant user password.'
                  example: '|]|{+-'
                  nullable: false
                merchant_name:
                  type: required
                  description: 'string required Merchant name.'
                  example: architecto
                  nullable: false
                mcc:
                  type: string
                  description: 'Merchant 4-digit MCC code.'
                  example: '5999'
                  nullable: false
                terms_accepted:
                  type: boolean
                  description: 'Must be accepted.'
                  example: true
                  nullable: false
              required:
                - name
                - email
                - password
                - mcc
                - terms_accepted
      security: []
