                  description: 'Partner email. Must be a valid email.'
                  example: partner@example.com
                  nullable: false
                password:
                  type: string
                  description: 'Partner user password.'
                  example: '|]|{+-'
                  nullable: false
                partner_name:
                  type: required
                  description: 'string Partner name.'
                  example: architecto
                  nullable: false
                partner_type:
                  type: string
                  description: ''
                  example: service_provider
                  nullable: false
                  enum:
                    - service_provider
                    - reseller
                    - technology_partner
                terms_accepted:
                  type: boolean
                  description: 'Must be accepted.'
                  example: true
                  nullable: false
              required:
                - name
                - email
                - password
                - partner_type
                - terms_accepted
