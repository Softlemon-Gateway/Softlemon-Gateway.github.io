# Builds the Zudoku docs site and deploys it to GitHub Pages.
#
# INERT UNTIL GO-LIVE. Before this can take effect, repository Settings >
# Pages > Source must be switched to "GitHub Actions". See README.md for the
# go-live checklist. The api repository's publish-docs.yml only refreshes
# specs/ here, so both workflows can coexist.
name: Deploy docs site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
