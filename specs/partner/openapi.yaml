                      description: 'Customer country as a 2-letter ISO code.'
                      example: GB
                    merchant_customer_id:
                      type:
                        - string
                        - 'null'
                      description: 'Your id for this customer.'
                      example: player-981
                customer_reference:
                  type:
                    - string
                    - 'null'
                  description: 'Your customer or session reference, returned on the session.'
                  example: player-981
                success_url:
                  type: string
                  description: 'Browser return URL after the customer finishes at the provider. Informational only, never proof of payment. Returned on the session as `return_url`.'
                  example: 'https://merchant.example.com/deposit/complete'
                cancel_url:
                  type: string
                  description: 'Browser return URL if the customer cancels at the provider. Returned on the session as `cancel_url`.'
                  example: 'https://merchant.example.com/deposit/cancelled'
                metadata:
                  type:
                    - object
                    - 'null'
                  description: 'Arbitrary key/value pairs stored with the session.'
                  example:
                    campaign: welcome
                  properties: []
                merchant_id:
                  type:
                    - integer
                    - 'null'
                  description: 'Required for partner API keys. Must be a merchant linked to the authenticated partner.'
                  example: 123
              required:
                - amount
                - currency
                - reference
                - payment_method
                - customer
                - success_url
                - cancel_url
