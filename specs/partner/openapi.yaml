                  example: 25.0
                currency:
                  type: string
                  description: 'Payment currency as a 3-letter ISO code.'
                  example: EUR
                reference:
                  type: string
                  description: 'Your unique payment reference.'
                  example: DEP-2048
                payment_method:
                  type: string
                  description: 'Redirect payment method.'
                  example: psc
                  enum:
                    - psc
                    - ideal
                    - giropay
                customer:
                  type: object
                  description: 'Customer details.'
                  properties:
                    email:
                      type:
                        - string
                        - 'null'
                      description: 'Customer email (required by some providers e.g. Paycent).'
                      example: jane@example.com
                    first_name:
                      type:
                        - string
                        - 'null'
                      description: 'Customer first name.'
                      example: Jane
                    last_name:
                      type:
                        - string
                        - 'null'
                      description: 'Customer last name.'
                      example: Doe
                    country_code:
                      type:
                        - string
                        - 'null'
                      description: "Customer country as a 2-letter ISO code. Strongly recommended: the method's country availability is checked before the provider is called and a country the method does not serve is refused with `ERR_PAYMENT_METHOD_NOT_AVAILABLE_IN_COUNTRY`."
                      example: GB
                    ip_address:
                      type:
                        - string
                        - 'null'
                      description: "The customer's IP address as seen by your server (IPv4 or IPv6). Strongly recommended for server-to-server integrations: the provider risk-checks the shopper's IP, and without this field it receives the IP of the server calling this API instead. Send the real value you observed; never a substitute."
                      example: 198.51.100.5
                    merchant_customer_id:
                      type:
                        - string
                        - 'null'
                      description: 'Your id for this customer.'
                      example: player-981
                    phone:
                      type:
                        - string
                        - 'null'
                      description: 'Must not be greater than 64 characters.'
                      example: z
                    city:
                      type:
                        - string
                        - 'null'
                      description: 'Must not be greater than 255 characters.'
                      example: m
                    postal_code:
                      type:
                        - string
                        - 'null'
                      description: 'Must not be greater than 64 characters.'
                      example: i
                    address:
                      type:
                        - string
                        - 'null'
                      description: 'Must not be greater than 255 characters.'
                      example: 'y'
                method_data:
                  type:
                    - object
                    - 'null'
                  description: 'optional Provider-neutral extra fields for the selected method (allowlisted keys only).'
                  example:
                    bic: DEUTDEFF
                  properties:
                    bic:
                      type:
                        - string
                        - 'null'
                      description: 'Must not be greater than 64 characters.'
                      example: v
                    iban:
                      type:
                        - string
                        - 'null'
                      description: 'Must not be greater than 64 characters.'
                      example: d
                    account_holder_name:
                      type:
                        - string
                        - 'null'
                      description: 'Must not be greater than 255 characters.'
                      example: l
                    identity:
                      type:
                        - string
                        - 'null'
                      description: 'Must not be greater than 255 characters.'
                      example: j
                customer_reference:
                  type:
                    - string
                    - 'null'
                  description: 'Your customer or session reference, returned on the session.'
                  example: player-981
                success_url:
                  type: string
                  description: 'Browser return URL after the customer finishes at the provider. Informational only, never proof of payment. Returned on the session as `return_url`.'
                  example: 'https://merchant.example.com/deposit/complete'
                cancel_url:
                  type: string
                  description: 'Browser return URL if the customer cancels at the provider. Returned on the session as `cancel_url`.'
                  example: 'https://merchant.example.com/deposit/cancelled'
                metadata:
                  type:
                    - object
                    - 'null'
                  description: 'Arbitrary key/value pairs stored with the session.'
                  example:
                    campaign: welcome
                  properties: []
                merchant_id:
                  type:
                    - integer
                    - 'null'
                  description: 'Required for partner API keys. Must be a merchant linked to the authenticated partner.'
                  example: 123
              required:
                - amount
                - currency
                - reference
                - payment_method
                - customer
                - success_url
                - cancel_url
