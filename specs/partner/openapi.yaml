                            type: integer
                            example: 123
                          merchant_reference:
                            type: string
                            example: DEP-2048
                          provider:
                            type: string
                            example: skrill
                          payment_method:
                            type: string
                            example: psc
                          status:
                            type: string
                            example: pending_redirect
                          amount:
                            type: integer
                            example: 2500
                          amount_formatted:
                            type: string
                            example: '25.00 EUR'
                          currency:
                            type: string
                            example: EUR
                          checkout_url:
                            type: string
                            example: 'https://pay.skrill.com/app/?sid=a1b2c3d4e5'
                          return_url:
                            type: string
                            example: 'https://merchant.example.com/deposit/complete'
                          cancel_url:
                            type: string
                            example: 'https://merchant.example.com/deposit/cancelled'
                          provider_session_id:
                            type: string
                            example: a1b2c3d4e5
                          provider_transaction_id:
                            type: string
                            example: null
                          customer_reference:
                            type: string
                            example: player-981
                          expires_at:
                            type: string
                            example: '2026-08-08T10:30:00.000000Z'
                          finalised_at:
                            type: string
                            example: null
                          created_at:
                            type: string
                            example: '2026-08-08T10:15:00.000000Z'
                          updated_at:
                            type: string
                            example: '2026-08-08T10:15:00.000000Z'
        400:
          description: ''
