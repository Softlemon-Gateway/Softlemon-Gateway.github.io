  /api/v1/webhook/test:
    post:
      summary: 'Send a test ping'
      operationId: sendATestPing
      description: "Send a signed `ping` event to the endpoint synchronously and report\nwhether the receiver answered with a 2xx status. Use it to verify\nreachability and signature handling before real events flow. A\nsuccessful ping verifies the endpoint (it stamps `last_success_at` and\nresets the failure streak), which is what unlocks payment-session\ncreation when the webhook readiness gate is enabled. The ping never\nappears in delivery history and a failed ping persists nothing. A\nfailing receiver still returns HTTP 200 here, check `data.success`\nfor the outcome. Limited to 10 pings per minute per API key.\n\nMerchant API keys ping their own endpoint. Partner API keys must\ninclude `merchant_id` for a linked merchant."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Ping sent'
                  code: ''
                  data:
                    success: true
                    status_code: 200
                    duration_ms: 184
                    error: null
                    delivery_status: healthy
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Ping sent'
                  code:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      success:
