  /api/v1/payment-instruments:
    get:
      summary: 'List payment instruments'
      operationId: listPaymentInstruments
      description: "List the cards stored in the vault for a merchant. An instrument is\ncreated automatically when a card transaction succeeds and the acquirer\nreturns a vault token. Use the `vault_token` value to charge the stored\ncard again, as described in the [returning customers guide](/guides/returning-customers).\n\nMerchant API keys list their own instruments. Partner API keys must\ninclude `merchant_id` for a linked merchant."
      parameters:
        -
          in: query
          name: status
          description: 'Filter by status.'
          example: active
          required: false
          schema:
            type: string
            enum:
              - active
              - expired
              - revoked
        -
          in: query
          name: merchant_id
          description: 'Required for partner API keys. Must be a merchant linked to the authenticated partner.'
          example: 123
          required: false
          schema:
            type: integer
        -
          in: query
          name: per_page
          description: 'Number of instruments per page (1-100, default 25).'
          example: 25
          required: false
          schema:
            type: integer
        -
          in: query
          name: page
          description: 'Page number (1+).'
          example: 1
          required: false
          schema:
            type: integer
      responses:
        200:
          description: ''
          content:
            application/json:
