  /api/v1/payment-methods:
    get:
      summary: 'List available payment methods'
      operationId: listAvailablePaymentMethods
      description: "List the alternative (redirect) payment methods enabled for a merchant and, when\n`country` and/or `currency` are given, whether each one can be offered to that\nshopper. Use it to decide which methods to show at checkout before calling\n`POST /api/v1/payment-sessions`: a method with `available: false` would be refused\nthere with the matching error (`ERR_PAYMENT_METHOD_NOT_AVAILABLE_IN_COUNTRY`,\n`ERR_PAYMENT_METHOD_NOT_ENABLED`).\n\nThe answer is computed from your enablement and the provider's published\navailability; it never contacts the provider to open a payment and has no side\neffects, so it is safe to call per checkout. It is advisory: the create call still\nruns the full provider preflight. Card payments are not listed; they are routed by\nyour acquirer configuration and accepted on `POST /api/v1/transactions`.\n\n`supported_countries` and `supported_currencies` are the restrictions in force for\neach method; an empty list means no restriction is known. `unavailable_reasons`\nis one or more of `country_not_supported`, `currency_not_supported`,\n`provider_not_offering`.\n\nMerchant API keys list their own methods. Partner API keys must include\n`merchant_id` for a linked merchant."
      parameters:
        -
          in: query
          name: country
          description: 'Two-letter ISO 3166-1 alpha-2 country of the shopper. When given, each method reports whether it is available there.'
          example: DE
          required: false
          schema:
            type: string
        -
          in: query
          name: currency
          description: 'Three-letter ISO 4217 currency of the intended payment. When given, each method reports whether it can be paid in it.'
          example: EUR
          required: false
          schema:
            type: string
        -
          in: query
          name: merchant_id
          description: 'Required for partner API keys. Must be a merchant linked to the authenticated partner.'
          example: 123
          required: false
          schema:
            type: integer
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Payment methods retrieved'
                  code: ''
