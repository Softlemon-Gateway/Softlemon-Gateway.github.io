  /api/v1/payment-sessions:
    post:
      summary: 'Create a payment session'
      operationId: createAPaymentSession
      description: "Create a redirect payment session and return the provider `checkout_url` to send\nthe customer to. The session expires 15 minutes after creation if the customer\ndoes not complete the hosted payment page.\n\nMerchant API keys act on their own account. Partner API keys must include\n`merchant_id` for a linked merchant.\n\nSessions never accept card data. Requests carrying card, token, CVV or voucher\nfields are rejected with HTTP 422. Duplicate requests reusing an active\n`reference` are rejected with HTTP 409. See the [duplicate protection guide](/guides/duplicate-protection).\n\nSend `customer.country_code` and `customer.ip_address` (the shopper's IP as seen by\nyour server). The provider risk-checks the shopper's IP; without `customer.ip_address`\nit receives the IP of the server calling this API, which can get every payment\nrefused when that server is in a country the method does not serve. Country\navailability is checked before the provider is called.\n\nFollow the [alternative payment guide](/guides/accept-an-alternative-payment) for the full flow."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Payment session created'
                  code: ''
                  data:
                    payment_session:
                      payment_session_id: ps_01J8FYK3ZQ4T9RB2M6XD5A7CWE
                      transaction_id: 4512
                      merchant_id: 123
                      merchant_reference: DEP-2048
                      provider: skrill
                      payment_method: psc
                      status: pending_redirect
                      amount: 2500
                      amount_formatted: '25.00 EUR'
                      currency: EUR
