                    description: "Webhook setup required (ERR_WEBHOOK_SETUP_REQUIRED): the merchant's webhook endpoint must be configured, active and verified by a successful test ping before payment sessions can be created. See the [webhooks guide](/guides/webhooks)."
                    type: object
                    example:
