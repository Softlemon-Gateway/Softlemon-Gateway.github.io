                        example: null
                  -
                    description: 'Country not served (ERR_PAYMENT_METHOD_NOT_AVAILABLE_IN_COUNTRY): the method is not available for `customer.country_code`. Checked before the provider is called; nothing is created. Offer another method for that country.'
