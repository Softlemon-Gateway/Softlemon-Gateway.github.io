      description: "Register the HTTPS endpoint that receives signed webhook events, or\nupdate it in place. On first creation the response includes the\nplaintext signing secret exactly once. The secret is stored encrypted\nand can never be read back, so capture it from that response and\nstore it securely. Updates never return or regenerate the secret.\n\nThe URL must use HTTPS on a publicly resolvable host. URLs with\nembedded credentials, localhost style hosts or private IP addresses\nare rejected. See the [set up webhooks guide](/guides/set-up-webhooks)\nfor the full walkthrough.\n\nMerchant API keys manage their own endpoint (one per merchant).\nPartner API keys must include `merchant_id` for a linked merchant."
