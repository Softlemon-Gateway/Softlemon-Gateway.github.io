  /api/v1/payment-sessions:
    post:
      summary: 'Create a payment session'
      operationId: createAPaymentSession
      description: "Create a redirect payment session and return the provider `checkout_url` to send\nthe customer to. The session expires 15 minutes after creation if the customer\ndoes not complete the hosted payment page.\n\nMerchant API keys act on their own account. Partner API keys must include\n`merchant_id` for a linked merchant.\n\nSessions never accept card data. Requests carrying card, token, CVV or voucher\nfields are rejected with HTTP 422. Duplicate requests reusing an active\n`reference` are rejected with HTTP 409. See the [duplicate protection guide](/guides/duplicate-protection).\n\nFollow the [alternative payment guide](/guides/accept-an-alternative-payment) for the full flow."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Payment session created'
                  code: ''
                  data:
                    payment_session:
                      payment_session_id: ps_01J8FYK3ZQ4T9RB2M6XD5A7CWE
                      transaction_id: 4512
                      merchant_id: 123
                      merchant_reference: DEP-2048
                      provider: skrill
                      payment_method: psc
                      status: pending_redirect
                      amount: 2500
                      amount_formatted: '25.00'
                      currency: EUR
                      checkout_url: 'https://pay.skrill.com/app/?sid=a1b2c3d4e5'
                      return_url: 'https://merchant.example.com/deposit/complete'
                      cancel_url: 'https://merchant.example.com/deposit/cancelled'
                      provider_session_id: a1b2c3d4e5
                      provider_transaction_id: null
                      customer_reference: player-981
                      expires_at: '2026-08-08T10:30:00.000000Z'
                      finalised_at: null
                      created_at: '2026-08-08T10:15:00.000000Z'
                      updated_at: '2026-08-08T10:15:00.000000Z'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Payment session created'
                  code:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      payment_session:
                        type: object
                        properties:
                          payment_session_id:
                            type: string
                            example: ps_01J8FYK3ZQ4T9RB2M6XD5A7CWE
                          transaction_id:
                            type: integer
                            example: 4512
                          merchant_id:
                            type: integer
                            example: 123
                          merchant_reference:
                            type: string
                            example: DEP-2048
                          provider:
                            type: string
                            example: skrill
                          payment_method:
                            type: string
                            example: psc
                          status:
                            type: string
                            example: pending_redirect
                          amount:
                            type: integer
                            example: 2500
                          amount_formatted:
                            type: string
                            example: '25.00'
                          currency:
                            type: string
                            example: EUR
