  /api/v1/3ds/verify:
    post:
      summary: 'Initiate Card Verification'
      operationId: initiateCardVerification
      description: "Initiate a 3D Secure card verification process before a payment request.\n\n**Frictionless flow:** If the issuer does not require a challenge, the response returns immediately\nwith `status: full_auth`. Use the returned `id` in `card_verification_data.id` when initiating the transaction.\n\n**Challenge flow:** The response includes a `challenge_url`. Redirect the cardholder there. After they\ncomplete the bank challenge, they are redirected to your `auth_url` with\n`?card_verification_id={id}&status={full_auth|failed}` query parameters. Use the `card_verification_id`\nvalue in `card_verification_data.id` when initiating the transaction.\n\nAuthenticate with a merchant API key or a partner API key plus `merchant_id`\nfor the merchant being acted on behalf of (same rules as the transaction endpoint)."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: '3DS authentication completed (frictionless)'
                  code: ''
                  data:
                    id: 166
                    amount: 1250
                    currency: EUR
                    version: 2.2.0
                    eci: '05'
                    cavv: AAABA0UREQAAAAAAAAAAAAAAAAA=
                    xid: null
                    ds_trans_id: 6b66be83-f692-405c-9079-92f7182af5e5
                    status: full_auth
                    auth_type: frictionless
                    challenge_url: null
                    post_url: null
                    html: null
                    created_at: '2025-06-12 09:47:15'
                    updated_at: '2025-06-12 09:47:15'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: '3DS authentication completed (frictionless)'
                  code:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 166
                      amount:
                        type: integer
                        example: 1250
                      currency:
                        type: string
                        example: EUR
                      version:
                        type: string
                        example: 2.2.0
                      eci:
                        type: string
                        example: '05'
                      cavv:
                        type: string
                        example: AAABA0UREQAAAAAAAAAAAAAAAAA=
                      xid:
                        type: string
                        example: null
                      ds_trans_id:
                        type: string
                        example: 6b66be83-f692-405c-9079-92f7182af5e5
                      status:
                        type: string
                        example: full_auth
                      auth_type:
                        type: string
                        example: frictionless
                      challenge_url:
                        type: string
                        example: 'https://yoursite.com/checkout/3ds-complete'
                      post_url:
                        type: string
                        example: null
                      html:
                        type: string
                        example: null
                      created_at:
                        type: string
                        example: '2025-06-12 09:47:15'
                      updated_at:
                        type: string
                        example: '2025-06-12 09:47:15'
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Authentication failed'
                  code: ERR_AUTH_FAILED
                  data: null
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Authentication failed'
                  code:
                    type: string
                    example: ERR_AUTH_FAILED
                  data:
                    type: string
                    example: null
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Validation errors'
                  code: ERR_VALIDATION_FAILED
                  data: null
                  errors:
                    amount:
                      - 'The amount is required.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Validation errors'
                  code:
                    type: string
                    example: ERR_VALIDATION_FAILED
                  data:
                    type: string
                    example: null
                  errors:
                    type: object
                    properties:
                      amount:
                        type: array
                        example:
                          - 'The amount is required.'
                        items:
                          type: string
        429:
          description: 'Rate limit exceeded. See [rate limits](/api-basics/rate-limits).'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Too many requests'
                  code: ERR_RATE_LIMITED
                  data: null
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
