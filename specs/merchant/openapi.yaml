                    example: ERR_RATE_LIMITED
                  data:
                    type: string
                    example: null
      tags:
        - 'Card Verification'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  description: 'Transaction amount in major units, for example 12.50 for EUR 12.50.'
                  example: 12.5
                currency:
                  type: string
                  description: 'Transaction currency (3-letter ISO code).'
                  example: EUR
                card:
                  type: object
                  description: 'Card details object.'
                  properties:
                    number:
                      type: string
                      description: 'Card number.'
                      example: '4200000000000091'
                    exp_month:
                      type: integer
                      description: 'Card expiry month (1-12).'
                      example: 12
                    exp_year:
                      type: integer
                      description: 'Card expiry year (4 digits).'
                      example: 2030
                    name:
                      type: string
                      description: 'Cardholder name.'
                      example: 'John Doe'
                    cvv:
                      type: string
                      description: 'Card CVV (3-4 digits). Optional for 3DS verification.'
                      example: '123'
                  required:
                    - number
                    - exp_month
                    - exp_year
                    - name
                auth_url:
                  type: string
                  description: 'Your return URL. After the cardholder completes the 3DS challenge, they are redirected here with ?card_verification_id={id}&status={full_auth|failed} query parameters.'
                  example: 'https://yoursite.com/checkout/3ds-complete'
                merchant_id:
                  type:
                    - integer
                    - 'null'
                  description: 'Required when authenticating with a partner API key. The id of a merchant linked to that partner. Omit when using a merchant API key.'
                  example: 123
                browser_data:
                  type: object
                  description: 'Browser data for 3DS 2.0 when the merchant uses the PXP acquirer. Optional for other acquirers.'
                  properties:
                    accept_header:
                      type: string
                      description: ''
                      example: 'text/html,application/xhtml+xml'
                    color_depth:
                      type: integer
                      description: ''
                      example: 24
                    java_enabled:
                      type: boolean
                      description: ''
                      example: false
                    java_script_enabled:
                      type: boolean
                      description: ''
                      example: true
                    language:
                      type: string
                      description: ''
                      example: en-US
                    screen_height:
                      type: integer
                      description: ''
                      example: 1080
                    screen_width:
                      type: integer
                      description: ''
                      example: 1920
                    time_zone_offset_in_minutes:
                      type: integer
                      description: ''
                      example: -60
                    user_agent:
                      type: string
                      description: ''
                      example: Mozilla/5.0...
                    ip_address:
                      type: string
                      description: ''
                      example: 203.0.113.1
              required:
                - amount
                - currency
                - card
                - auth_url
