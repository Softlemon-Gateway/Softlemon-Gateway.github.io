      operationId: listWebhookEvents
      description: "List recorded webhook events newest first (delivery history). List\nrows never include the payload snapshot, fetch a single event for\nthat. History depth equals the 30 day retention window, older events\nare pruned and cannot be listed or replayed.\n\nMerchant API keys list their own events. Partner API keys must\ninclude `merchant_id` for a linked merchant."
      parameters:
        -
          in: query
          name: status
          description: 'Filter by delivery status (pending, delivered, failed).'
          example: failed
          required: false
          schema:
            type: string
        -
          in: query
          name: event_type
          description: 'Filter by event type.'
          example: transaction.captured
          required: false
          schema:
            type: string
        -
          in: query
          name: from
          description: 'Filter events created on or after this date.'
          example: '2026-08-01'
          required: false
          schema:
            type: string
        -
          in: query
          name: to
          description: 'Filter events created on or before this date.'
          example: '2026-08-31'
          required: false
          schema:
            type: string
        -
          in: query
          name: transaction_id
          description: 'Filter to events for one transaction id.'
          example: 123456
          required: false
          schema:
            type: integer
        -
          in: query
          name: merchant_id
          description: 'Required for partner API keys. Must be a merchant linked to the authenticated partner.'
          example: 123
          required: false
          schema:
