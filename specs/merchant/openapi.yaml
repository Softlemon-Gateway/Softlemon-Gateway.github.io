          description: 'Rate limit exceeded. See [rate limits](/api-basics/rate-limits).'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Too many requests'
                  code: ERR_RATE_LIMITED
                  data: null
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Too many requests'
                  code:
                    type: string
                    example: ERR_RATE_LIMITED
                  data:
                    type: string
                    example: null
          headers:
            Retry-After:
              description: 'Seconds until the current rate limit window frees up.'
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: 'Requests left in the current 60 second window. Sent on every response and 0 here.'
              schema:
                type: integer
      tags:
        - 'API Operations'
