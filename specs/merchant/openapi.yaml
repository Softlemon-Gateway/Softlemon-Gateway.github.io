      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPingEvent'
            example:
              id: evt_01k20c4x9y5r08qwj6dfhm3bzt
              type: ping
              created_at: '2026-08-05T12:00:00Z'
              api_version: '2026-08-01'
              data:
                merchant_id: 42
      responses:
        200:
          description: 'Any 2xx status acknowledges the delivery.'
paths:
  /api/v1/transactions:
    post:
      summary: 'Initiate Transaction'
      operationId: initiateTransaction
      description: "Initiate a new transaction (sale or auth).\n\nMerchant API keys can call this endpoint for their own account.\nPartner API keys can also call this endpoint, but they must include `merchant_id`\nfor a merchant linked to that partner.\nPartner API keys can also capture, refund and void transactions for linked merchants under the same `merchant_id` rules.\n\nDuplicate requests reusing an active `reference` are rejected with HTTP 409. See the [duplicate protection guide](/guides/duplicate-protection)."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Transaction initiated'
                  code: ''
                  data:
                    transaction:
                      id: 2
                      merchant_id: 1
                      merchant_trans_id: ORDER-912346
                      amount: 1250
                      amount_formatted: '12.50 EUR'
                      currency: EUR
                      status: auth
                      transaction_type: auth
                      description: null
                      acquirer_provider: null
                      acquirer_trans_id: '514009741995'
                      acquirer_auth_code: '400066'
                      related_trans_id: null
                      captured_amount: 0
                      customer: null
                      cardholder:
                        card_last_four: '1111'
                        card_brand: visa
                        card_expiry_month: 12
                        card_expiry_year: 2030
                        created_at: '2025-05-20T09:18:47.000000Z'
                        updated_at: '2025-05-20T09:18:47.000000Z'
                      payment_instrument:
                        payment_instrument_id: pi_01k24d5re8xh1v0c9jc0m8w3ns
                        vault_token: 8ac7a4a29852f6f101985300a1b41c2f
                        type: card
                        status: active
                        card_brand: visa
                        card_last_four: '1111'
                        card_expiry_month: 12
                        card_expiry_year: 2030
                        created_at: '2025-05-20T09:18:48.000000Z'
                        updated_at: '2025-05-20T09:18:48.000000Z'
                      ip_address: 203.0.113.10
                      created_at: '2025-05-20T09:18:47.000000Z'
                      updated_at: '2025-05-20T09:18:48.000000Z'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Transaction initiated'
                  code:
                    type: string
                    example: ''
                  data:
                    type: object
                    properties:
                      transaction:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 2
                          merchant_id:
                            type: integer
                            example: 1
                          merchant_trans_id:
                            type: string
                            example: ORDER-912346
                          amount:
                            type: integer
                            example: 1250
                          amount_formatted:
                            type: string
                            example: '12.50 EUR'
                          currency:
                            type: string
                            example: EUR
                          status:
                            type: string
                            example: auth
                          transaction_type:
                            type: string
                            example: auth
                          description:
                            type: string
                            example: null
                          acquirer_provider:
                            type: string
                            example: null
                          acquirer_trans_id:
                            type: string
                            example: '514009741995'
                          acquirer_auth_code:
                            type: string
                            example: '400066'
                          related_trans_id:
                            type: string
                            example: null
                          captured_amount:
                            type: integer
                            example: 0
                          customer:
                            type: string
                            example: null
                          cardholder:
                            type: object
                            properties:
                              card_last_four:
                                type: string
                                example: '1111'
                              card_brand:
                                type: string
                                example: visa
                              card_expiry_month:
                                type: integer
                                example: 12
                              card_expiry_year:
                                type: integer
                                example: 2030
                              created_at:
                                type: string
                                example: '2025-05-20T09:18:47.000000Z'
                              updated_at:
                                type: string
                                example: '2025-05-20T09:18:47.000000Z'
                          payment_instrument:
                            type: object
                            properties:
                              payment_instrument_id:
                                type: string
                                example: pi_01k24d5re8xh1v0c9jc0m8w3ns
                              vault_token:
                                type: string
                                example: 8ac7a4a29852f6f101985300a1b41c2f
                              type:
                                type: string
                                example: card
                              status:
                                type: string
                                example: active
                              card_brand:
                                type: string
                                example: visa
                              card_last_four:
                                type: string
                                example: '1111'
                              card_expiry_month:
                                type: integer
                                example: 12
                              card_expiry_year:
                                type: integer
                                example: 2030
                              created_at:
                                type: string
                                example: '2025-05-20T09:18:48.000000Z'
                              updated_at:
                                type: string
                                example: '2025-05-20T09:18:48.000000Z'
                          ip_address:
                            type: string
                            example: 203.0.113.10
                          created_at:
                            type: string
                            example: '2025-05-20T09:18:47.000000Z'
                          updated_at:
                            type: string
                            example: '2025-05-20T09:18:48.000000Z'
        400:
          description: 'Transaction rejected. The `code` field identifies the reason. See the [error catalogue](/api-basics/errors).'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Transaction rejected by risk checks.'
                  code: ERR_RISK_REJECTED
                  data:
                    transaction_id: 185
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Transaction rejected by risk checks.'
                  code:
                    type: string
                    example: ERR_RISK_REJECTED
                  data:
                    type: object
                    properties:
                      transaction_id:
                        type: integer
                        example: 185
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Authentication failed'
                  code: ERR_AUTH_FAILED
                  data: null
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Authentication failed'
                  code:
                    type: string
                    example: ERR_AUTH_FAILED
                  data:
                    type: string
                    example: null
        409:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'A transaction with this reference already exists'
                  code: ERR_DUPLICATE
                  data:
                    transaction_id: 123
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'A transaction with this reference already exists'
                  code:
                    type: string
                    example: ERR_DUPLICATE
                  data:
                    type: object
                    properties:
                      transaction_id:
                        type: integer
                        example: 123
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Validation errors'
                  code: ERR_VALIDATION_FAILED
                  data: null
                  errors:
                    amount:
                      - 'The transaction amount must be a number.'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Validation errors'
                  code:
                    type: string
                    example: ERR_VALIDATION_FAILED
                  data:
                    type: string
                    example: null
                  errors:
                    type: object
                    properties:
                      amount:
                        type: array
                        example:
                          - 'The transaction amount must be a number.'
                        items:
                          type: string
        429:
          description: 'Rate limit exceeded. See [rate limits](/api-basics/rate-limits).'
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Too many requests'
                  code: ERR_RATE_LIMITED
                  data: null
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Too many requests'
                  code:
                    type: string
                    example: ERR_RATE_LIMITED
                  data:
                    type: string
                    example: null
          headers:
            Retry-After:
              description: 'Seconds until the current rate limit window frees up.'
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: 'Requests left in the current 60 second window. Sent on every response and 0 here.'
              schema:
                type: integer
      tags:
        - Transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  description: 'Transaction amount in major units, for example 12.50 for EUR 12.50. Responses and webhooks report amounts in minor units.'
                  example: 12.5
                currency:
                  type: string
                  description: 'Transaction currency (3-letter ISO code).'
                  example: EUR
                transaction_type:
                  type: string
                  description: 'Transaction type.'
                  example: sale
                  enum:
                    - sale
                    - auth
                wallet:
                  type:
                    - object
                    - 'null'
                  description: 'Digital wallet payment. Mutually exclusive with card and vault_token.'
                  properties:
                    type:
                      type: string
                      description: 'required_with:wallet Wallet provider.'
                      example: apple_pay
                      enum:
                        - apple_pay
                        - google_pay
                    token:
                      type: string
                      description: 'required_with:wallet Encrypted payment token from Apple Pay or Google Pay.'
                      example: '{"version":"EC_v1","data":"..."}'
                vault_token:
                  type:
                    - string
                    - 'null'
                  description: 'Vault token of a stored card, returned in the payment_instrument object of a previous transaction response. Tokens are scoped to the merchant that stored the card. When provided, card number and expiry are not required. Only CVV is still needed.'
                  example: vtok_a1b2c3d4e5f6
                card:
                  type: object
                  description: 'Card details object. Required unless vault_token or wallet is provided.'
                  properties:
                    number:
                      type: string
                      description: 'Card number. Required if no vault_token or wallet.'
                      example: '4111111111111111'
                    exp_month:
                      type: string
                      description: 'Card expiry month (2 digits). Required if no vault_token or wallet.'
                      example: '12'
                    exp_year:
                      type: string
                      description: 'Card expiry year (4 digits). Required if no vault_token or wallet.'
                      example: '2030'
                    cvv:
                      type: string
                      description: 'Card CVV number (3-4 digits). Required if no wallet.'
                      example: '123'
                    name:
                      type:
                        - string
                        - 'null'
                      description: 'Cardholder name.'
                      example: 'John Doe'
                reference:
                  type:
                    - string
                    - 'null'
                  description: 'Merchant reference for this transaction.'
                  example: order-10001
                merchant_id:
                  type:
                    - integer
                    - 'null'
                  description: 'Required for partner API keys. Omit for merchant API keys.'
                  example: 123
                success_url:
                  type:
                    - string
                    - 'null'
                  description: 'URL to redirect to on successful payment (reserved for future use).'
                  example: 'https://yoursite.com/checkout/success'
                error_url:
                  type:
                    - string
                    - 'null'
                  description: 'URL to redirect to on failed payment (reserved for future use).'
                  example: 'https://yoursite.com/checkout/error'
                customer:
                  type:
                    - object
                    - 'null'
                  description: 'Customer details object.'
                  properties:
                    merchant_customer_id:
                      type: string
                      description: "Merchant's ID of the customer."
                      example: cust-001
                    first_name:
                      type: string
                      description: "Customer's first name."
                      example: John
                    last_name:
                      type: string
                      description: "Customer's last name."
                      example: Doe
                    email:
                      type: string
                      description: "Customer's email address."
                      example: john.doe@example.com
                    phone:
                      type:
                        - string
                        - 'null'
                      description: "Customer's phone number."
                      example: '+441234567890'
                    address:
                      type:
                        - string
                        - 'null'
                      description: "Customer's address."
                      example: '1 High Street'
                    city:
                      type:
                        - string
                        - 'null'
                      description: "Customer's city."
                      example: London
                    postal_code:
                      type:
                        - string
                        - 'null'
                      description: "Customer's postal code."
                      example: 'SW1A 1AA'
                    country_code:
                      type:
                        - string
                        - 'null'
                      description: "Customer's country code."
                      example: GB
                    ip_address:
                      type:
                        - string
                        - 'null'
                      description: "Customer's IP address."
                      example: 198.51.100.5
                  required:
                    - merchant_customer_id
                    - first_name
                    - last_name
                    - email
                card_verification_data:
                  type:
                    - object
                    - 'null'
                  description: 'Links a completed 3DS verification to this transaction. Pass the id returned from POST /api/v1/3ds/verify. The API retrieves stored CAVV, ECI and DS Transaction ID automatically. The verification must have ended in full_auth, attempt or unavailable; a failed or unfinished verification is refused with HTTP 422.'
                  properties:
                    id:
                      type:
                        - string
                        - 'null'
                      description: 'ID of the 3DS verification record returned by POST /api/v1/3ds/verify, either the `tds_...` public id or the numeric id.'
                      example: tds_01k0w3v9fcx2e8qz5m7h4n6j2p
                    status:
                      type:
                        - string
                        - 'null'
                      description: 'This field is required when <code>card_verification_data.id</code> is not present.'
                      example: architecto
                      enum:
                        - init
                        - challenge_pending
                        - attempt
                        - partial_auth
                        - full_auth
                        - failed
                        - unavailable
                        - error
                    cavv:
                      type:
                        - string
                        - 'null'
                      description: 'This field is required when <code>card_verification_data.id</code> is not present.'
                      example: architecto
                    xid:
                      type:
                        - string
                        - 'null'
                      description: ''
                      example: architecto
                    ds_trans_id:
                      type:
                        - string
                        - 'null'
                      description: 'This field is required when <code>card_verification_data.id</code> is not present.'
                      example: architecto
                    three_ds_version:
                      type:
                        - string
                        - 'null'
                      description: ''
                      example: architecto
                    eci:
                      type:
                        - string
                        - 'null'
                      description: ''
                      example: architecto
                  required:
                    - id
                browser_data:
                  type:
                    - object
                    - 'null'
                  description: 'Browser fingerprint for provider-led 3DS (same shape as POST /api/v1/3ds/verify). Recommended for Paycent to reduce unnecessary 3DS challenges.'
                  example:
                    accept_header: text/html
                    color_depth: 24
                    java_enabled: false
                    java_script_enabled: true
                    language: en-US
                    screen_height: 1080
                    screen_width: 1920
                    time_zone_offset_in_minutes: -60
                    user_agent: Mozilla/5.0
                  properties:
                    accept_header:
                      type: string
                      description: ''
                      example: 'text/html,application/xhtml+xml'
                    color_depth:
                      type: integer
                      description: ''
                      example: 24
                    java_enabled:
                      type: boolean
                      description: ''
                      example: false
                    java_script_enabled:
                      type: boolean
                      description: ''
                      example: true
                    language:
                      type: string
                      description: ''
                      example: en-US
                    screen_height:
                      type: integer
                      description: ''
                      example: 1080
                    screen_width:
                      type: integer
                      description: ''
                      example: 1920
                    time_zone_offset_in_minutes:
                      type: integer
                      description: ''
                      example: -60
                    user_agent:
                      type: string
                      description: ''
                      example: Mozilla/5.0...
                    ip_address:
                      type:
                        - string
                        - 'null'
                      description: ''
                      example: 203.0.113.1
                    window_height:
                      type:
                        - integer
                        - 'null'
                      description: 'Paycent device window height.'
                      example: 700
                    window_width:
                      type:
                        - integer
                        - 'null'
                      description: 'Paycent device window width.'
                      example: 1220
                    time_zone:
                      type:
                        - string
                        - 'null'
                      description: 'Paycent IANA time zone.'
                      example: Europe/Paris
              required:
                - amount
                - currency
                - transaction_type
  '/api/v1/transactions/{transaction_id}/capture':
